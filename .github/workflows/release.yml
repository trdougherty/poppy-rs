name: Build and publish to PyPI

on:
  push:
    tags:
      - "v*"          # trigger on any version tag, e.g. v0.2.0
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  # -----------------------------------------------------------------------
  # Build wheels for Linux, macOS, and Windows
  # -----------------------------------------------------------------------
  build:
    name: Build wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          # manylinux: builds a portable Linux wheel inside a manylinux
          # container — compatible with virtually all Linux distros
          manylinux: auto

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  # -----------------------------------------------------------------------
  # Build a pure source distribution (sdist) for users who want to compile
  # from source (e.g. unsupported architectures)
  # -----------------------------------------------------------------------
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  # -----------------------------------------------------------------------
  # Publish all artifacts to PyPI
  # -----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/poppy-rs/
    permissions:
      id-token: write   # required for trusted publishing (no API token needed)

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: PyPA/gh-action-pypi-publish@release/v1
